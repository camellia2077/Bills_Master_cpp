<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Bills metallic coin logo</title>
  <defs>
    <radialGradient id="coin" cx="31%" cy="22%" r="78%">
      <stop offset="0" stop-color="#FFF7BC"/>
      <stop offset="0.24" stop-color="#FFE782"/>
      <stop offset="0.62" stop-color="#F5C43E"/>
      <stop offset="1" stop-color="#A96908"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6B0"/>
      <stop offset="0.26" stop-color="#EAB52C"/>
      <stop offset="0.72" stop-color="#8B5206"/>
      <stop offset="1" stop-color="#F8D45B"/>
    </linearGradient>
    <linearGradient id="roseGold" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFE9E5"/>
      <stop offset="0.28" stop-color="#F4B5B8"/>
      <stop offset="0.68" stop-color="#C97982"/>
      <stop offset="1" stop-color="#8C3F54"/>
    </linearGradient>
    <filter id="coinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#5D3905" flood-opacity=".34"/>
    </filter>
    <filter id="emboss" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="5" flood-color="#713246" flood-opacity=".62"/>
    </filter>
  </defs>
  <g filter="url(#coinShadow)">
    <circle cx="256" cy="256" r="240" fill="url(#rim)"/>
    <circle cx="256" cy="256" r="217" fill="url(#coin)" stroke="#FFEE9A" stroke-width="6"/>
    <circle cx="256" cy="256" r="197" fill="none" stroke="#B7780B" stroke-opacity=".56" stroke-width="5"/>
    <path d="M81 160C125 63 243 38 345 72C249 88 163 137 101 226C74 209 69 183 81 160Z" fill="#FFFBD2" opacity=".42"/>
    <path d="M95 371C183 425 320 438 404 348C375 438 304 477 220 469C154 463 111 431 95 371Z" fill="#8C5208" opacity=".28"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="330" font-weight="700" text-anchor="middle" filter="url(#emboss)">
    <text x="256" y="359" fill="#733247">$</text>
    <text x="256" y="347" fill="url(#roseGold)">$</text>
  </g>
</svg>
